name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Build installer (NSIS + portable)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Building NSIS + portable ==="
          npx electron-builder --win nsis portable
          echo "=== Exit code: $? ==="
          echo "=== dist/ contents ==="
          ls -la dist/ || true
          echo "=== latest.yml ==="
          cat dist/latest.yml 2>/dev/null || echo "No latest.yml found"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag: $TAG"
          # Upload all exe files and latest.yml
          gh release create "$TAG" \
            --title "HolyMusic $TAG" \
            --generate-notes \
            dist/*.exe dist/latest.yml 2>&1
          echo "gh release exit code: $?"
