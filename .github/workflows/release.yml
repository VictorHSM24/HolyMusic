name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build installer (NSIS + portable)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis portable

      - name: List built files
        shell: bash
        run: |
          ls -la dist/*.exe dist/*.yml 2>/dev/null || echo "No files found"
          echo "---"
          cat dist/latest.yml 2>/dev/null || echo "No latest.yml"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag: $TAG"
          gh release create "$TAG" \
            --title "HolyMusic $TAG" \
            --generate-notes \
            dist/HolyMusic-*-x64.exe \
            dist/HolyMusic-*-x64-portable.exe \
            dist/latest.yml \
            2>&1 || echo "gh release create failed (may already exist)"
