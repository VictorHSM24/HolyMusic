appId: com.holymusic.app
productName: HolyMusic
copyright: Copyright © 2026 HolyMusic
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
publish:
  provider: github
  owner: VictorHSM24
  repo: HolyMusic
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HolyMusic
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
